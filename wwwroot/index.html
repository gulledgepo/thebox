<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Box</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="PaxstonProject.styles.css" rel="stylesheet" />
    <style>
        .loading-heart {
            animation: loading-pulse 1.2s ease-in-out infinite;
        }

        .loading-text {
            font-weight: 500;
            letter-spacing: 0.15em;
        }

        .loading-text span {
            display: inline-block;
            opacity: 0;
            transform: translateY(-0.5em);
            animation: letter-drop 0.4s ease-out forwards;
        }

        @keyframes loading-pulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.15); opacity: 1; }
        }

        @keyframes letter-drop {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Match the article padding that Blazor's scoped CSS applies */
        #app > .loading-wrapper {
            padding-left: 32px;
            padding-right: 24px;
            padding-top: 1.1rem;
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="loading-wrapper">
            <div class="centered-box-stack">
                <div class="centered-box">
                    <div class="box">
                        <span class="box-heart loading-heart" aria-hidden="true">❤️</span>
                    </div>
                </div>
                <span class="box-count" style="visibility:hidden">The box is love. Show the box your devotion.</span>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
